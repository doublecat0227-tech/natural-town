<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#bdd8e8">

<title>暖阳河谷小镇</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#bfd9e9;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;touch-action:none}#app{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}.brand{position:fixed;top:max(12px,env(safe-area-inset-top));left:14px;z-index:10;padding:9px 12px;border-radius:14px;background:#faf7eee0;backdrop-filter:blur(12px);font-size:14px;font-weight:700;color:#2d2a24;box-shadow:0 8px 24px #453b2b1f}.tip{position:fixed;top:max(58px,calc(env(safe-area-inset-top) + 52px));left:14px;right:14px;width:max-content;max-width:calc(100% - 28px);z-index:10;padding:6px 10px;border-radius:12px;background:#1e1d1985;color:#fff;font-size:11px}.joystick{position:fixed;left:20px;bottom:max(24px,calc(env(safe-area-inset-bottom) + 14px));width:116px;height:116px;border-radius:50%;background:#ffffff2e;border:1px solid #ffffff52;backdrop-filter:blur(8px);z-index:20}.stick{position:absolute;left:34px;top:34px;width:48px;height:48px;border-radius:50%;background:#ffffffa6;box-shadow:0 4px 18px #0002}.action{position:fixed;right:22px;bottom:max(34px,calc(env(safe-area-inset-bottom) + 24px));width:72px;height:72px;border-radius:50%;border:1px solid #ffffff80;background:#fff6ddd1;font-size:14px;font-weight:700;color:#4b4032;z-index:20;box-shadow:0 8px 24px #0002}.panel{position:fixed;left:14px;right:14px;bottom:max(130px,calc(env(safe-area-inset-bottom) + 120px));z-index:30;padding:16px 18px;border-radius:18px;background:#faf7eff0;box-shadow:0 16px 45px #30271c33;color:#2d2a24}.panel h2{margin:0 28px 6px 0;font-size:18px}.panel p{margin:0;line-height:1.6;font-size:14px;color:#625a4d}.panel button{position:absolute;right:10px;top:8px;border:0;background:none;font-size:26px;color:#756b5e}.hidden{display:none}.near{position:fixed;left:50%;bottom:max(28px,calc(env(safe-area-inset-bottom) + 18px));transform:translateX(-50%);z-index:15;padding:7px 12px;border-radius:999px;background:#231f198c;color:#fff;font-size:11px;pointer-events:none}.cross{position:fixed;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:#ffffffa6;box-shadow:0 0 0 1px #00000026;z-index:9}.boot{position:fixed;inset:0;display:grid;place-items:center;z-index:50;background:#bfd9e9;color:#3e4a45;font:600 14px -apple-system,BlinkMacSystemFont,sans-serif;text-align:center;padding:28px}@media(min-width:900px){.joystick,.action{display:none}}
</style>
</head><body>
<div id="app"></div><div id="boot" class="boot">正在加载 3D 小镇…</div>
<div class="brand">暖阳河谷小镇 <span style="opacity:.55">V3.1</span></div>
<div class="tip">左下移动 · 单指拖动视角 · 双指缩放 · 右下互动</div><div class="cross"></div>
<div id="near" class="near hidden"></div><div id="joy" class="joystick"><div id="stick" class="stick"></div></div><button id="action" class="action">互动</button>
<div id="panel" class="panel hidden"><button id="close">×</button><h2 id="pt"></h2><p id="pb"></p></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(function(){
const boot=document.getElementById('boot');
function fail(msg){boot.style.background='#f3eee4';boot.style.color='#5b4438';boot.textContent='3D 场景加载失败：'+msg}
try{
if(!window.THREE) throw new Error('Three.js 未加载，请检查网络');
const THREE=window.THREE,app=document.getElementById('app'),scene=new THREE.Scene();scene.background=new THREE.Color(0xbad7eb);scene.fog=new THREE.FogExp2(0xc6d6d2,.011);
const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,500);camera.position.set(22,12,27);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;app.appendChild(renderer.domElement);
const target=new THREE.Vector3(0,2.4,0),spherical=new THREE.Spherical().setFromVector3(camera.position.clone().sub(target));let dragging=false,lastX=0,lastY=0,pinch=0;
function updateCam(){spherical.phi=Math.max(.25,Math.min(1.48,spherical.phi));spherical.radius=Math.max(7,Math.min(48,spherical.radius));camera.position.copy(target).add(new THREE.Vector3().setFromSpherical(spherical));camera.lookAt(target)}
renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY});renderer.domElement.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;spherical.theta-=dx*.006;spherical.phi-=dy*.006;updateCam()});addEventListener('pointerup',()=>dragging=false);
renderer.domElement.addEventListener('wheel',e=>{spherical.radius*=1+Math.sign(e.deltaY)*.08;updateCam()},{passive:true});
renderer.domElement.addEventListener('touchmove',e=>{if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch)spherical.radius*=pinch/d;pinch=d;updateCam()}},{passive:true});renderer.domElement.addEventListener('touchend',()=>pinch=0);
scene.add(new THREE.HemisphereLight(0xeaf4ff,0x88754f,1.7));const sun=new THREE.DirectionalLight(0xffe2ad,4);sun.position.set(-18,30,12);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.9});const M={plaster:mat(0xe5d7bd),stone:mat(0x9e9484),stone2:mat(0x756c61),roof:mat(0x8d4f36),wood:mat(0x6f4e32),dark:mat(0x3f3428),green:mat(0x536a55),grass:mat(0x76935b),water:new THREE.MeshStandardMaterial({color:0x5d9dba,roughness:.18,transparent:true,opacity:.86}),orange:mat(0xc6783c),white:mat(0xf0e5d2),black:mat(0x2d2b27)};
function sh(o){o.castShadow=o.receiveShadow=true;return o}function add(o){scene.add(o);return o}function box(w,h,d,m,x=0,y=0,z=0){const o=sh(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m));o.position.set(x,y,z);return add(o)}function cyl(a,b,h,m,x=0,y=0,z=0,n=12){const o=sh(new THREE.Mesh(new THREE.CylinderGeometry(a,b,h,n),m));o.position.set(x,y,z);return add(o)}
const ground=sh(new THREE.Mesh(new THREE.PlaneGeometry(120,120),M.grass));ground.rotation.x=-Math.PI/2;add(ground);const river=sh(new THREE.Mesh(new THREE.PlaneGeometry(18,78),M.water));river.rotation.x=-Math.PI/2;river.position.set(-19,.08,-2);add(river);
for(let z=-34;z<=34;z+=3){box(1.8,.7,2.2,M.stone,-9.8,.35,z);box(1.4,.55,1.8,M.stone2,-28.4,.28,z+1.2)}for(let z=-32;z<=32;z+=2.2)for(let x=-6;x<=9;x+=2.3){const p=box(2.1,.14,1.75,M.stone,x,.08,z);p.rotation.y=(Math.random()-.5)*.05}
function house(x,z,s=1,shop=false){const g=new THREE.Group();g.position.set(x,0,z);let o=sh(new THREE.Mesh(new THREE.BoxGeometry(7*s,6*s,6*s),M.plaster));o.position.y=3*s;g.add(o);o=sh(new THREE.Mesh(new THREE.ConeGeometry(5.3*s,2.4*s,4),M.roof));o.position.y=7.1*s;o.rotation.y=Math.PI/4;o.scale.z=.78;g.add(o);for(const wx of[-2,1.6])for(const wy of[2.3,4.1]){o=sh(new THREE.Mesh(new THREE.BoxGeometry(1.25*s,1.3*s,.14*s),M.dark));o.position.set(wx*s,wy*s,3.08*s);g.add(o)}if(shop){o=sh(new THREE.Mesh(new THREE.BoxGeometry(4.8*s,.18*s,1.4*s),M.green));o.position.set(.5*s,3.2*s,3.75*s);o.rotation.x=-.18;g.add(o)}add(g);return g}
const cafe=house(10,-8,1,true);[[14,7,.9],[7,18,.75],[16,22,.78],[8,-22,.82],[17,-27,.7]].forEach(v=>house(...v));for(let i=0;i<12;i++)house(30+Math.random()*14,-28+Math.random()*55,.45+Math.random()*.18);
for(let i=-4;i<=4;i++)box(2.7,.5,2.5,M.stone,-19,1.25,i*2.3);for(const side of[-1,1])for(let i=-4;i<=4;i++)box(.38,1.5,2.35,M.stone2,-19+side*4.1,1.65,i*2.3);
function tree(x,z,s=1){cyl(.38*s,.55*s,4.5*s,M.wood,x,2.25*s,z,10);const o=sh(new THREE.Mesh(new THREE.SphereGeometry(2.6*s,12,9),mat(0x587847)));o.position.set(x,5*s,z);o.scale.y=.8;add(o)}[[-2,-10,1.25],[0,20,1.1],[6,28,.9],[-6,9,1],[-3,-26,1.2],[22,4,.85],[23,-18,.8]].forEach(v=>tree(...v));
function fence(x1,z1,x2,z2,n=10){for(let i=0;i<=n;i++){const t=i/n;box(.16,1.25,.16,M.wood,x1+(x2-x1)*t,.63,z1+(z2-z1)*t)}const dx=x2-x1,dz=z2-z1,len=Math.hypot(dx,dz),ang=Math.atan2(dx,dz);for(const y of[.45,.92]){const r=box(.11,.11,len,M.wood,(x1+x2)/2,y,(z1+z2)/2);r.rotation.y=ang}}fence(13.5,4.2,24.8,4.2,14);fence(24.8,4.2,24.8,15.8,14);fence(13.5,15.8,24.8,15.8,14);
function bench(x,z,rot=0){const g=new THREE.Group();let o=sh(new THREE.Mesh(new THREE.BoxGeometry(2.5,.18,.65),M.wood));o.position.y=.75;g.add(o);o=sh(new THREE.Mesh(new THREE.BoxGeometry(2.5,.75,.16),M.wood));o.position.set(0,1.15,.28);g.add(o);g.position.set(x,0,z);g.rotation.y=rot;add(g)}bench(15.2,12.8,Math.PI/2);bench(-6.2,18.5,Math.PI/2);bench(-6.2,-2.5,Math.PI/2);
const interact=[];function cat(x,z,s=.75,name='小猫'){const g=new THREE.Group();let o=sh(new THREE.Mesh(new THREE.CapsuleGeometry(.55*s,1.2*s,5,10),M.orange));o.rotation.z=Math.PI/2;g.add(o);o=sh(new THREE.Mesh(new THREE.SphereGeometry(.58*s,14,10),M.orange));o.position.set(.75*s,.18*s,0);g.add(o);o=sh(new THREE.Mesh(new THREE.SphereGeometry(.34*s,10,8),M.white));o.position.set(1.13*s,.08*s,0);g.add(o);g.position.set(x,.85*s,z);g.userData={title:name,body:'它注意到你了，轻轻摇了摇尾巴。',kind:'cat'};add(g);interact.push(g)}cat(18.5,9.4,.85,'庭院里的小橘');cat(-2.5,13,.68,'河边晒太阳的猫');cat(7,-15,.62,'咖啡馆门口的猫');cafe.userData={title:'河岸咖啡馆',body:'面向石桥和河流的小咖啡馆。',kind:'place'};interact.push(cafe);
const ray=new THREE.Raycaster(),center=new THREE.Vector2(),panel=document.getElementById('panel'),pt=document.getElementById('pt'),pb=document.getElementById('pb');function hit(){ray.setFromCamera(center,camera);const h=ray.intersectObjects(interact,true);if(!h.length)return null;let o=h[0].object;while(o&&!interact.includes(o))o=o.parent;return o}document.getElementById('close').onclick=()=>panel.classList.add('hidden');document.getElementById('action').onclick=()=>{const o=hit();pt.textContent=o?o.userData.title:'附近没有可互动对象';pb.textContent=o?o.userData.body:'把屏幕中央的小白点对准猫咪或咖啡馆。';panel.classList.remove('hidden')};
let jx=0,jy=0,jid=null;const joy=document.getElementById('joy'),stick=document.getElementById('stick');function jm(e){const r=joy.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,mag=Math.hypot(dx,dy),mx=34,k=mag>mx?mx/mag:1;jx=dx*k/mx;jy=dy*k/mx;stick.style.transform='translate('+dx*k+'px,'+dy*k+'px)'}joy.onpointerdown=e=>{jid=e.pointerId;joy.setPointerCapture(jid);jm(e)};joy.onpointermove=e=>{if(e.pointerId===jid)jm(e)};function je(e){if(e.pointerId!==jid)return;jid=null;jx=jy=0;stick.style.transform='translate(0,0)'}joy.onpointerup=je;joy.onpointercancel=je;
const near=document.getElementById('near'),clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.04),f=new THREE.Vector3();camera.getWorldDirection(f);f.y=0;f.normalize();const r=new THREE.Vector3().crossVectors(f,new THREE.Vector3(0,1,0)).normalize(),mv=new THREE.Vector3().addScaledVector(r,jx).addScaledVector(f,-jy);if(mv.lengthSq()>.01){mv.normalize().multiplyScalar(dt*6.2);target.add(mv);updateCam()}const o=hit();if(o){near.textContent='可互动 · '+o.userData.title;near.classList.remove('hidden')}else near.classList.add('hidden');renderer.render(scene,camera)}updateCam();loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
boot.style.opacity='0';boot.style.transition='opacity .35s';setTimeout(()=>boot.remove(),400);
}catch(e){fail(e.message||String(e))}
})();
</script></body></html>
